<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Greenhouse - Cloud Dashboard</title>
  
  <!-- Tailwind CSS cho giao diện đẹp -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK (Tích hợp trực tiếp không qua node_modules) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto">
    <!-- Header -->
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 bg-slate-800/50 p-5 rounded-2xl border border-slate-700/50 backdrop-blur-sm shadow-lg">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">
          Nhà Màng Thông Minh (Cloud)
        </h1>
        <div class="flex items-center gap-2 text-sm text-slate-400 mt-2">
          <span class="relative flex h-3 w-3">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75" id="dot-ping"></span>
            <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500" id="dot-solid"></span>
          </span>
          <span id="conn-status" class="font-medium text-emerald-400">Đang đồng bộ Firebase...</span>
          <span class="text-slate-600">|</span>
          <span id="last-update" class="text-xs">Cập nhật lúc: --</span>
        </div>
      </div>
      
      <!-- Cụm nút bấm -->
      <div class="flex items-center gap-3">
        <!-- Nút xóa dữ liệu -->
        <button onclick="clearFirebaseData()" class="bg-slate-700/50 hover:bg-red-500/80 text-white font-semibold py-2.5 px-4 rounded-xl shadow-lg border border-slate-600 transition-all flex items-center gap-2">
          <span>🗑️</span> Xóa Dữ Liệu
        </button>

        <!-- Nút tải CSV -->
        <button onclick="downloadCSV()" class="bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-white font-semibold py-2.5 px-5 rounded-xl shadow-lg shadow-emerald-900/20 transition-all flex items-center gap-2">
          <span>💾</span> Tải CSV (Cloud)
        </button>
      </div>
    </header>

    <!-- Thẻ hiển thị dữ liệu -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- Thẻ Nhiệt độ -->
      <div class="bg-slate-800/50 p-6 rounded-2xl border border-slate-700/50 flex flex-col justify-between">
        <div class="text-slate-400 text-sm font-semibold uppercase tracking-wider mb-2">🌡️ Nhiệt độ</div>
        <div class="flex items-baseline gap-2">
          <span id="val-temp" class="text-5xl font-bold text-amber-500">--</span>
          <span class="text-xl text-slate-500">°C</span>
        </div>
      </div>

      <!-- Thẻ Độ ẩm -->
      <div class="bg-slate-800/50 p-6 rounded-2xl border border-slate-700/50 flex flex-col justify-between">
        <div class="text-slate-400 text-sm font-semibold uppercase tracking-wider mb-2">💧 Độ ẩm</div>
        <div class="flex items-baseline gap-2">
          <span id="val-humid" class="text-5xl font-bold text-blue-400">--</span>
          <span class="text-xl text-slate-500">%</span>
        </div>
      </div>

      <!-- Thẻ Ánh sáng -->
      <div class="bg-slate-800/50 p-6 rounded-2xl border border-slate-700/50 flex flex-col justify-between">
        <div class="text-slate-400 text-sm font-semibold uppercase tracking-wider mb-2">☀️ Ánh sáng</div>
        <div class="flex items-baseline gap-2">
          <span id="val-light" class="text-5xl font-bold text-yellow-400">--</span>
          <span class="text-xl text-slate-500">lux</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 1. CẤU HÌNH FIREBASE (Sử dụng Database URL của bạn)
    const firebaseConfig = {
      databaseURL: "https://clooect-data-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    // 2. KHỞI TẠO FIREBASE
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // 3. LẮNG NGHE DỮ LIỆU THỜI GIAN THỰC (Realtime listener)
    const currentRef = database.ref('greenhouse/current');
    
    currentRef.on('value', (snapshot) => {
      const data = snapshot.val();
      
      if (data) {
        // Cập nhật giá trị lên giao diện
        document.getElementById('val-temp').innerText = data.temperature !== undefined ? data.temperature : '--';
        document.getElementById('val-humid').innerText = data.humidity !== undefined ? data.humidity : '--';
        document.getElementById('val-light').innerText = data.light !== undefined ? data.light : '--';
        
        // Cập nhật thời gian
        document.getElementById('last-update').innerText = "Cập nhật lúc: " + (data.timestamp || "Vừa xong");
        
        // Hiệu ứng nháy đèn online
        document.getElementById('dot-ping').classList.remove('hidden');
        document.getElementById('conn-status').innerText = 'Đồng bộ trực tiếp (Live)';
        document.getElementById('conn-status').className = 'font-medium text-emerald-400';
      } else {
        document.getElementById('conn-status').innerText = 'Chưa có dữ liệu từ ESP32';
        document.getElementById('conn-status').className = 'font-medium text-amber-500';
      }
    }, (error) => {
      console.error("Lỗi khi đọc Firebase:", error);
      document.getElementById('dot-ping').classList.add('hidden');
      document.getElementById('conn-status').innerText = 'Lỗi kết nối Firebase';
      document.getElementById('conn-status').className = 'font-medium text-red-500';
    });

    // 4. HÀM TẢI FILE CSV TỪ FIREBASE
    async function downloadCSV() {
      try {
        const btn = document.querySelector('button');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<span>⏳</span> Đang chuẩn bị...';
        
        // Đọc toàn bộ lịch sử (logs) từ Firebase
        const logsSnapshot = await database.ref('greenhouse/logs').once('value');
        const logs = logsSnapshot.val();
        
        if (!logs) {
          alert("Chưa có dữ liệu lịch sử trên Firebase!");
          btn.innerHTML = originalText;
          return;
        }

        // Tạo nội dung CSV
        let csvContent = "timestamp,temperature,humidity,light\n";
        
        // Lấy tất cả các ID tự sinh của Firebase (Push IDs)
        const keys = Object.keys(logs);
        keys.forEach(key => {
          const row = logs[key];
          // Trích xuất các trường (nếu thiếu sẽ để trống)
          const t = row.timestamp || "";
          const temp = row.temperature !== undefined ? row.temperature : "";
          const hum = row.humidity !== undefined ? row.humidity : "";
          const light = row.light !== undefined ? row.light : "";
          
          csvContent += `${t},${temp},${hum},${light}\n`;
        });

        // Tạo file tải về
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", "cloud_data.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        btn.innerHTML = originalText;
      } catch (error) {
        console.error("Lỗi tải CSV:", error);
        alert("Có lỗi xảy ra khi tải dữ liệu từ Firebase!");
        document.querySelector('button[onclick="downloadCSV()"]').innerHTML = '<span>💾</span> Tải CSV (Cloud)';
      }
    }

    // 5. HÀM XÓA TOÀN BỘ DỮ LIỆU LỊCH SỬ TRÊN FIREBASE
    async function clearFirebaseData() {
      const isConfirmed = confirm("⚠️ CẢNH BÁO!\n\nBạn có chắc chắn muốn XÓA TOÀN BỘ dữ liệu lịch sử trên Cloud không?\nHành động này không thể hoàn tác!");
      
      if (isConfirmed) {
        try {
          const btn = document.querySelector('button[onclick="clearFirebaseData()"]');
          const originalText = btn.innerHTML;
          btn.innerHTML = '<span>⏳</span> Đang xóa...';

          // Gọi lệnh xóa thẳng thư mục 'greenhouse/logs'
          await database.ref('greenhouse/logs').remove();
          
          alert("✅ Đã xóa toàn bộ dữ liệu cũ thành công! Bắt đầu thu thập file mới.");
          btn.innerHTML = originalText;
        } catch (error) {
          console.error("Lỗi khi xóa:", error);
          alert("❌ Không thể xóa dữ liệu: " + error.message);
          document.querySelector('button[onclick="clearFirebaseData()"]').innerHTML = '<span>🗑️</span> Xóa Dữ Liệu';
        }
      }
    }
  </script>
</body>
</html>
